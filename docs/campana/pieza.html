<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pieza de campaña</title>
<!--
  Una sola página dibuja todas las piezas de la campaña. Se elige con la
  dirección: pieza.html?p=c1  (c1…c7 carrusel 4:5, h1…h3 historias 9:16,
  v1 marco del video, v2 cierre del video). generar.ps1 las saca a PNG con
  Edge sin ventana. Las imágenes y la letra son las de la página web.
-->
<style>
  @font-face { font-family: "Anton"; src: url("../../sitio/fuentes/anton.ttf"); }
  :root {
    --fondo: #08142A; --azul: #13294B; --linea: #22355A;
    --oro: #F4B942; --texto: #EAF0F8; --suave: #A8B5CB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--fondo); }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: var(--texto);
    background:
      radial-gradient(1100px 700px at 85% -10%, #1E3A66 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #2A2148 0%, transparent 60%),
      var(--fondo);
    display: flex; flex-direction: column; padding: 84px 72px 64px;
  }
  .historia body, body.historia { padding: 250px 72px 300px; }
  .ceja { font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
  h1 {
    font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 104px; line-height: 1.04; letter-spacing: .005em; margin-top: 18px;
  }
  h1 em { font-style: normal; color: var(--oro); }
  .sub { font-size: 40px; line-height: 1.3; color: var(--suave); margin-top: 26px; max-width: 900px; }
  .marco {
    flex: 1; min-height: 0; margin-top: 48px; display: flex; align-items: center; justify-content: center;
  }
  .marco img {
    max-width: 100%; max-height: 100%; border-radius: 22px; border: 3px solid var(--linea);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.85), 0 8px 20px -8px rgba(0,0,0,.5);
  }
  .pie { display: flex; align-items: center; gap: 20px; margin-top: 44px; }
  .pie img { width: 68px; height: 68px; }
  .pie .nombre { font-size: 36px; font-weight: 600; }
  .pie .dir { font-size: 28px; color: var(--suave); }
  .pie .num { margin-left: auto; font-size: 30px; color: var(--suave); }
  .pie .sigue { margin-left: auto; font-size: 32px; color: var(--oro); font-weight: 600; }

  /* Cierre: todo al medio */
  body.cierre { align-items: center; justify-content: center; text-align: center; }
  body.cierre .logo { width: 260px; height: 260px; margin-bottom: 48px; }
  body.cierre h1 { font-size: 120px; }
  body.cierre .lista { font-size: 46px; color: var(--texto); margin-top: 36px; line-height: 1.5; }
  body.cierre .url {
    margin-top: 56px; font-size: 40px; font-weight: 600; color: var(--fondo); background: var(--oro);
    padding: 22px 40px; border-radius: 999px;
  }
  body.cierre .nota { margin-top: 30px; font-size: 30px; color: var(--suave); }

  /* Marco del video vertical: el video va en el hueco negro */
  body.video { padding: 150px 60px 0; }
  body.video h1 { font-size: 112px; }
  body.video .hueco { position: absolute; left: 0; top: 700px; width: 1080px; height: 608px; background: #000; }
  body.video .abajo { position: absolute; left: 60px; right: 60px; top: 1370px; }
  body.video .abajo .lista { font-size: 44px; line-height: 1.55; }
  body.video .abajo .lista b { color: var(--oro); font-weight: 600; }
  body.video .abajo .pie { margin-top: 56px; }
</style>
</head>
<body>
<script>
  const P = new URLSearchParams(location.search).get('p') || 'c1';
  const IMG = '../../sitio/img/';
  const LOGO = IMG + 'logo.svg';
  const WEB = 'ecclesiacast.github.io/EcclesiaCast';

  const carrusel = [
    ['Gratis · Para Windows · En español', 'Las canciones y la Biblia, <em>en un solo programa</em>', null, 'operador.webp'],
    ['La Biblia', 'Escribí «Juan 3:16» <em>y listo</em>', 'También en dos versiones a la vez.', 'salida-biblia.webp'],
    ['Fondos', 'La letra sobre <em>imágenes o videos</em>', null, 'salida-fondo.webp'],
    ['Desde el celular', 'Pasá las diapositivas <em>con el pulgar</em>', 'Con la wifi de la iglesia, aunque no tenga internet.', 'celular.webp'],
    ['Para los músicos', 'Una pantalla con <em>lo que viene</em>', null, 'escenario.webp'],
    ['El culto, armado antes', 'La playlist <em>del domingo</em>', 'Canciones, pasajes, videos y avisos, en orden.', 'playlist.webp'],
  ];

  function pie(derecha) {
    return `<div class="pie"><img src="${LOGO}"><div><div class="nombre">EcclesiaCast</div>` +
      `<div class="dir">${WEB}</div></div>${derecha}</div>`;
  }

  function lamina(ceja, titulo, sub, imagen, derecha) {
    document.body.innerHTML =
      `<div class="ceja">${ceja}</div><h1>${titulo}</h1>` +
      (sub ? `<p class="sub">${sub}</p>` : '') +
      `<div class="marco"><img src="${IMG}${imagen}"></div>` + pie(derecha);
  }

  function cierre(nota) {
    document.body.className += ' cierre';
    document.body.innerHTML =
      `<img class="logo" src="${LOGO}"><h1>Gratis <em>para siempre</em></h1>` +
      `<div class="lista">Para Windows · En español<br>Funciona sin internet · Software libre</div>` +
      `<div class="url">${WEB}</div><div class="nota">${nota}</div>`;
  }

  const n = parseInt(P.slice(1), 10);
  if (P[0] === 'c' && n <= 6) {
    const [ceja, titulo, sub, imagen] = carrusel[n - 1];
    lamina(ceja, titulo, sub, imagen, n === 1 ? '<div class="sigue">Deslizá →</div>' : `<div class="num">${n} / 7</div>`);
  } else if (P === 'c7') {
    cierre('Descargalo desde el enlace de la biografía');
  } else if (P === 'h1') {
    document.body.className = 'historia';
    lamina('Ya salió', 'Un programa gratis para <em>proyectar en la iglesia</em>',
      'Canciones, Biblia, fondos y avisos. Se maneja desde la PC o desde el celular.', 'operador.webp', '');
  } else if (P === 'h2') {
    document.body.className = 'historia';
    lamina('La Biblia en un segundo', 'Escribí la cita <em>y ya está en pantalla</em>',
      'En una o en dos versiones a la vez.', 'salida-biblia.webp', '');
  } else if (P === 'h3') {
    document.body.className = 'historia';
    cierre('Tocá el enlace para descargarlo');
  } else if (P === 'v1') {
    document.body.className = 'video';
    document.body.innerHTML =
      `<div class="ceja">Gratis · Para Windows · En español</div>` +
      `<h1>Un programa gratis para <em>proyectar en la iglesia</em></h1>` +
      `<div class="hueco"></div>` +
      `<div class="abajo"><div class="lista"><b>Canciones</b> y la <b>Biblia</b> en un solo programa.<br>` +
      `Fondos con video, avisos y playlist.<br>Se maneja también <b>desde el celular</b>.</div>` +
      pie('') + `</div>`;
  } else if (P === 'v2') {
    cierre('Mandáselo al de multimedia de tu iglesia');
  }
</script>
</body>
</html>
