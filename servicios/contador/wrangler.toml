# Contador anónimo de uso de EcclesiaCast. Pasos en LEEME.md.
name = "ecclesiacast-contador"
main = "src/contador.js"
compatibility_date = "2026-11-01"

routes = [{ pattern = "contador.ecclesiacast.org", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "ecclesiacast-contador"
# Lo completa `wrangler d1 create ecclesiacast-contador` (ver LEEME.md).
database_id = "COMPLETAR"
