name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.0.0)"
        required: true

permissions:
  contents: write
  # SignPath reads this run's details and downloads the unsigned installer.
  actions: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish (self-contained x64)
        run: >
          dotnet publish src/EcclesiaCast.App/EcclesiaCast.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      # The program itself is signed BEFORE the installer is built, so the
      # signed EcclesiaCast.App.exe is what goes inside it. The updater only
      # checks that a new installer has the same publisher as the installed
      # program when that program is signed, so this is what turns the check on.
      # Two requests per release: this one (artifact configuration «app-exe»,
      # see .signpath/artifact-configuration-app.xml) and the installer's below.
      # Both wait for a hand approval in SignPath. Off until SignPath is set up.
      - name: Upload unsigned application
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: EcclesiaCast-app-unsigned
          path: publish/EcclesiaCast.App.exe

      - name: Sign application (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: EcclesiaCast
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Use the signed application
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed-app\EcclesiaCast.App.exe publish\ -Force
          $signature = Get-AuthenticodeSignature publish\EcclesiaCast.App.exe
          $signature | Format-List Path, Status, SignerCertificate
          # An installer must never go out with an unsigned program inside it
          # when signing is on: that would turn the updater's check into a lie.
          if (-not $signature.SignerCertificate) { throw 'EcclesiaCast.App.exe came back from SignPath without a signature.' }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\EcclesiaCast.iss

      # Signing through SignPath Foundation (see «Code signing policy» in the
      # README). It stays off until the repository has the SIGNPATH_API_TOKEN
      # secret and the SIGNPATH_ORGANIZATION_ID variable; until then the
      # installer is published unsigned, as before.
      - name: Upload unsigned installer
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: EcclesiaCast-installer-unsigned
          path: dist/*.exe

      - name: Sign installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: EcclesiaCast
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # Every release is approved by hand in SignPath: give it an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed\*.exe dist\ -Force
          $signatures = Get-AuthenticodeSignature dist\*.exe
          $signatures | Format-List Path, Status, SignerCertificate
          if ($signatures | Where-Object { -not $_.SignerCertificate }) { throw 'The installer came back from SignPath without a signature.' }

      - uses: actions/upload-artifact@v7
        with:
          name: EcclesiaCast-installer
          path: dist/*.exe

      # The notes of the release are the section of this version in the
      # CHANGELOG (in Spanish): the program shows them in its update notice, so
      # they must be readable by the people who run it, not commit titles. The
      # marker under the signing line tells the program where the notes start.
      # Order of preference: «## [<version>]», then «## [Sin publicar]», and
      # only if neither has text, the notes GitHub generates.
      - name: Release notes from the CHANGELOG
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $signing = '[Code signing policy](https://github.com/EcclesiaCast/EcclesiaCast#code-signing-policy) · [Política de privacidad](https://github.com/EcclesiaCast/EcclesiaCast/blob/main/docs/privacidad.md)'
          $lines = @(Get-Content -Path CHANGELOG.md -Encoding UTF8)

          function Get-Section([string]$name) {
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^##\s*\[' + [regex]::Escape($name) + '\]')) { $start = $i + 1; break }
            }
            if ($start -lt 0) { return '' }
            $end = $lines.Count
            for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^##\s*\[') { $end = $i; break }
            }
            if ($end -le $start) { return '' }
            return (($lines[$start..($end - 1)]) -join "`n").Trim()
          }

          $section = Get-Section $env:VERSION
          if (-not $section) { $section = Get-Section 'Sin publicar' }

          if ($section) {
            $body = $signing + "`n`n<!-- notas -->`n`n" + $section + "`n"
            $generate = 'false'
          } else {
            $body = $signing + "`n"
            $generate = 'true'
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          "generate=$generate" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          # A version with a suffix (v1.0.0-beta.1, -rc.2...) is a pre-release,
          # so it doesn't get announced as the latest stable download.
          prerelease: ${{ contains(github.ref_name, '-') }}
