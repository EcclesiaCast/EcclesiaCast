name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
      # The Avalonia render bench runs inside the tests above (Desktop.Tests).
      # Its pictures and measures are kept to download and compare with a Mac's.
      - name: Keep the Avalonia render results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-avalonia-windows
          path: artifacts/render/avalonia/
          if-no-files-found: warn

  # Core, Data, Presentation (the view models) and Desktop (the Avalonia
  # interface) are not WPF, so their tests must also pass on a Mac with an
  # Apple chip. The test projects are targeted directly (not the solution)
  # because the app itself is WPF and only builds on Windows.
  test-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/EcclesiaCast.Core.Tests --configuration Release --verbosity normal
      - name: Test view models
        run: dotnet test tests/EcclesiaCast.Presentation.Tests --configuration Release --verbosity normal
      # Includes the Avalonia render bench (every case in four themes).
      - name: Test the Avalonia interface
        run: dotnet test tests/EcclesiaCast.Desktop.Tests --configuration Release --verbosity normal
      - name: Keep the Avalonia render results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-avalonia-mac
          path: |
            artifacts/render/avalonia/
            artifacts/render/comparacion/
          if-no-files-found: warn
