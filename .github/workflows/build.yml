name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # Core, Data and Presentation (the view models) are plain .NET, so their
  # tests must also pass on a Mac with an Apple chip. The test projects are
  # targeted directly (not the solution) because the app itself is WPF and
  # only builds on Windows.
  test-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/EcclesiaCast.Core.Tests --configuration Release --verbosity normal
      - name: Test view models
        run: dotnet test tests/EcclesiaCast.Presentation.Tests --configuration Release --verbosity normal
